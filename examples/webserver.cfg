var requesttimeout = 30
var webports = {8080, 8443}

$[
  server: $[
    datacenter: 3,
    node: 17,
    ports: @(webports),
    limits: $[
      connections: 500,
      timeout: @(requesttimeout)
    ]
  ],
  features: {1, 0, 1},
  nodes: {
    $[region: 1, priority: 10],
    $[region: 2, priority: 20]
  }
]
