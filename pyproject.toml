[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edu-config-xml"
version = "1.0.0"
description = "Транслятор учебного конфигурационного языка в XML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
config2xml = "config_converter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
